# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
system_colors: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: 100%
      height: 30
    padding:
      top: 10
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - komorebi_button
      - komorebi_active_layout
      - komorebi_workspaces
      - quick_launch
      - apps
      - terminal_hotkey
      center:
      - clock
      right:
      - media
      - wallpapers
      - systray
      - mem_clean
      - volume
      - language
      - power_menu
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>家</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: false
      blur: false
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a, %d %b %H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{level}"
      tooltip: true
      icons:
        "muted": "\uf026" # Icon for muted
        "10": "\uf026"  # Icon for 0-10% volume
        "30": "\uf026"  # Icon for 11-30% volume
        "60": "\uf026"  # Icon for 31-60% volume
        "100": "\uf026" # Icon for 61-100% volume
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uf107"
          toggle_up: "\uf106"
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\udb80\udc09</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  win_button:
      type: "yasb.custom.CustomWidget"
      options:
        label: "家"
        label_alt: "家"
        class_name: "system-widget"
        callbacks:
          on_left: "exec start_menu"
  terminal_hotkey:
    type: "yasb.custom.CustomWidget"
    options:
      label: ""
      label_alt: ""
      class_name: "hotkey-widget"
      callbacks:
        on_left: "do_nothing"
      # Global hotkey, works anywhere in Windows, not just while the bar has focus.
      keybindings:
        - keys: "ctrl+alt+t"
          action: "exec wt.exe"
          screen: "active" # opens the terminal on whichever screen you're working on
        - keys: "ctrl+alt+q"
          action: 'exec powershell -NoProfile -WindowStyle Hidden -Command "(New-Object -ComObject WScript.Shell).SendKeys(''%{F4}'')"'
          screen: "active" # sends Alt+F4 to whatever window is currently focused
  komorebi_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb81\ude40</span>"
      label_alt: "<span>\udb81\ude40</span>"
      class_name: "system-widget"
      callbacks:
        on_left: 'exec powershell -NoProfile -WindowStyle Hidden -Command "if (Get-Process komorebi -ErrorAction SilentlyContinue) { komorebic stop --whkd; Start-Sleep -Seconds 1; Stop-Process -Name komorebi -Force -ErrorAction SilentlyContinue } else { komorebic start --whkd }"'
        on_middle: 'exec powershell -NoProfile -WindowStyle Hidden -Command "komorebic stop --whkd; Start-Sleep -Seconds 1; Stop-Process -Name komorebi -Force -ErrorAction SilentlyContinue; komorebic start --whkd"'
        on_right: "exec komorebic toggle-pause"
  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      hide_empty_workspaces: true
      hide_if_offline: false
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      waveform: 0
      waves: 0
      monstercat: 0
      sensitivity: 100
      edge_fade: 1
      min_bar_height: 0
      gradient: 1
      foreground: "#d9363e"
      gradient_color_1: '#8a232c'
      gradient_color_2: '#d9363e'
      gradient_color_3: '#ff5a4d'
      bars_number: 18
      bar_spacing: 2
      bar_width: 4
      bar_type: "waves"
      framerate: 60
      sleep_timer: 2
      hide_empty: true
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "▼"
      label_expanded: "▶"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: 1
      show_volume: false
      show_network: true
      use_hook: true
      icons_per_row: 3
      show_network: false
      use_hook: false # Whether to use the new systray hook instead of the legacy systray monitor
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  sysmonitor-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "spec-info-widget sysmonitor-grouper"
      widgets: [
        "cpu",
        "gpu",
        "memory",
        "disk",
        "battery"
      ]
      hide_empty: false
      collapse_options:
        enabled: true
        exclude_widgets: []
        expanded_label: ""
        collapsed_label: ""
        label_position: "left"
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{icon} {percent}% | remaining: {time_remaining}"
      class_name: "spec-info-widget"
      update_interval: 5000
      hide_unsupported: true
      callbacks:
        on_left: "toggle_label"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf200</span> {info[percent][total]}%"
      label_alt: "\uf200 CPU: {info[percent][total]}% | freq: {info[freq][current]:.2f} Mhz"
      class_name: "spec-info-widget"
      update_interval: 2000
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      gpu_index: 0
      label: "<span>\udb82\udd0c</span> {info[utilization]}%"
      label_alt: "\udb82\udd0c {info[mem_used]}/{info[mem_total]}"
      class_name: "spec-info-widget"
      update_interval: 2000
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      gpu_thresholds:
        low: 30
        medium: 60
        high: 90
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uf4bc</span> {virtual_mem_percent}%"
      label_alt: "\uf4bc {virtual_mem_free}/{virtual_mem_total} | SWAP: {swap_mem_percent}%"
      class_name: "spec-info-widget"
      update_interval: 3000
      callbacks:
        on_left: "toggle_menu"
        on_middle: 'exec powershell -NoProfile -WindowStyle Hidden -Command "Start-Process ''C:\Program Files\Mem Reduct\memreduct.exe'' -ArgumentList ''-clean''"'
        on_right: "toggle_label"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
  mem_clean:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb80\udce2</span>"
      label_alt: "<span>\udb80\udce2</span> Clean RAM"
      class_name: "system-widget"
      tooltip: true
      callbacks:
        # Left click: run Mem Reduct's command-line clean (-clean cleans and exits).
        # Edit the path below if Mem Reduct is installed somewhere else.
        on_left: 'exec powershell -NoProfile -WindowStyle Hidden -Command "Start-Process ''C:\Program Files\Mem Reduct\memreduct.exe'' -ArgumentList ''-clean''"'
        on_middle: "do_nothing"
        on_right: "toggle_label"
  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uf0a0</span> {space[used][percent]}"
      label_alt: "{volume_label} {space[used][gb]} / {space[total][gb]}"
      class_name: "spec-info-widget"
      volume_label: "C"
      update_interval: 60
      callbacks:
        on_left: "toggle_group"
        on_right: "toggle_label"
      disk_thresholds:
        low: 25
        medium: 50
        high: 90
      group_label:
        volume_labels: ["C"]
        show_label_name: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
      tooltip: true
      # Folder with your wallpapers. Can be a single string or a list of strings.
      image_path: "C:\\Users\\Merks\\Pictures\\wallpapers"
      change_automatically: false # Automatically change wallpaper
      update_interval: 60 # If change_automatically is true, update interval in seconds
      engine:
        enabled: true
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        type: "strip" # default/magnified/strip/slide
        image_width: 220
        orientation: "portrait" # landscape/portrait
        image_corner_radius: 12
        accent_color: "auto" # follows Windows accent, or a hex like "#d9363e"
      # Left click opens the gallery; once it's open, scroll the mouse
      # wheel over it to move the selection, then double-click (or Enter)
      # to set that wallpaper. Right click on the widget itself jumps
      # straight to a random wallpaper from the folder.
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "<span>\udb80\udf87</span>"
      label_alt: "<span>\udb80\udf87</span> {title}{s}{artist}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"
      max_field_size:
        label: 45
        label_alt: 30
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 50
        show_source: true
      media_menu_icons:
        play: "\uf04b"
        pause: "\uf04c"
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: "bounce-ease"  # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
      # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: false       # Whether to enable the progress bar on the widget.
        alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}"
      label_alt: "{lang[full_name]}"
      update_interval: 1
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      language_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
        layout_icon: "\udb80\udf0c"
  launchpad:
    type: "yasb.launchpad.LaunchpadWidget"
    options:
      label: "<span>\udb85\udcde</span>"
      search_placeholder: "Search apps..."
      app_icon_size: 48
      window:
        fullscreen: false
        width: 1024
        height: 768
        overlay_block: true
      window_style:
        enable_blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
      window_animation:
        fade_in_duration: 120
        fade_out_duration: 100
      group_apps: false
      callbacks:
        on_left: "toggle_launchpad"
      # Add/edit/delete apps (and set custom icons) from inside the popup:
      # Ctrl+N = add app, F2 = edit selected, Delete = remove, right-click = menu
  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      tooltip: true
      image_icon_size: 16 # only used if an icon is an image path
      # Each entry: icon (glyph code or full path to a small image), launch (command), name (tooltip).
      # Add, remove or reorder entries here to customize the icons.
      app_list:
        - {icon: "\uf489", launch: "wt", name: "Terminal"}
        - {icon: "\uf07b", launch: "explorer.exe", name: "File Explorer"}
        - {icon: "\uf0ac", launch: "C:\\Users\\Merks\\AppData\\Local\\imput\\Helium\\Application\\chrome.exe", name: "Helium"}
        - {icon: "\uf1bc", launch: "C:\\Users\\Merks\\AppData\\Roaming\\Spotify\\Spotify.exe", name: "Spotify"}
        # Image icon + program path example:
        # - {icon: "C:\\Users\\Merks\\icons\\vscode.png", launch: "C:\\Users\\Merks\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe", name: "VS Code"}
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\uf002</span>"
      search_placeholder: "Search applications..."
      max_results: 30
      show_icons: true
      icon_size: 32
      popup:
        width: 650
        height: 400
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
          screen: "primary"